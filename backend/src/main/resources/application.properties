spring.application.name=logistock-api
server.port=8080
server.error.include-message=always

# Base de données (valeurs surchargées par docker-compose)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/logistock}
spring.datasource.username=${DB_USER:logistock}
spring.datasource.password=${DB_PASSWORD:logistock_dev}

# JWT : le secret doit faire au moins 32 caractères
app.jwt.secret=${JWT_SECRET:dev-secret-logistock-a-changer-en-production-0123456789}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}

# Documentation de l'API : http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
